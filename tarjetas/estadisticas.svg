    .v { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #efe4d4; }
  </style>
  <rect x="0.5" y="0.5" rx="10" width="329" height="224" fill="#100e0c" stroke="#2a241f"/>
